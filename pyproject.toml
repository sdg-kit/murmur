[project]
name = "murmur"
version = "0.1.0"
description = "Thousands of tiny LLM agents with distilled personalities, on one GPU."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["anthropic>=0.40", "openai>=1.50", "modal>=0.70"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
