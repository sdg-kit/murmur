[project]
name = "murmur"
version = "0.1.0"
description = "Thousands of tiny LLM agents with distilled personalities, on one GPU."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []                    # the default (scripted) backend is pure standard library

[project.optional-dependencies]
render = ["pillow>=10"]             # render.py -> GIF
haiku  = ["anthropic>=0.40"]        # --backend haiku
vllm   = ["openai>=1.50"]           # --backend vllm (OpenAI-compatible client)
gpu    = ["openai>=1.50", "modal>=0.70"]   # serve.py / train_lora.py on a rented GPU
dev    = ["pytest>=8", "pillow>=10"]
all    = ["pillow>=10", "anthropic>=0.40", "openai>=1.50", "modal>=0.70", "pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
